name: MindOS Package Factory

# Her gün Debian 13 (trixie) deposundan yeni paketleri .mind yapar, Releases chunk'larına
# yükler ve packages.json'u günceller. Ayrıntılar: tools/mind_factory.py

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      new:
        description: 'Eklenecek yeni paket sayısı'
        required: false
        default: '400'
      updates:
        description: 'Yenilenecek paket sayısı (yeni Debian sürümü / eski Ubuntu tabanlı)'
        required: false
        default: '300'
      only:
        description: 'Yalnızca bu paketler (boşlukla ayrılmış, ör. "vim htop"); boşsa otomatik seçim'
        required: false
        default: ''

# packages.json'a aynı anda tek iş yazar
concurrency:
  group: packages-index
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  factory:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    container: debian:trixie
    env:
      GH_TOKEN: ${{ github.token }}
      MIND_REPO: ${{ github.repository }}
    steps:
      - name: Araçları kur
        run: |
          sed -i 's/^Components: main$/Components: main contrib non-free non-free-firmware/' /etc/apt/sources.list.d/debian.sources
          apt-get update -qq
          apt-get install -y -qq git gh python3 zstd ca-certificates >/dev/null

      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Paketleri üret ve yükle
        env:
          IN_NEW: ${{ github.event.inputs.new || '400' }}
          IN_UPDATES: ${{ github.event.inputs.updates || '300' }}
          IN_ONLY: ${{ github.event.inputs.only }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 tools/mind_factory.py --new "$IN_NEW" --updates "$IN_UPDATES" --only "$IN_ONLY"

      - name: packages.json'u gönder
        if: always()
        run: |
          git config user.name "MindOS Package Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages.json
          if git diff --cached --quiet; then echo "Değişiklik yok."; exit 0; fi
          git commit -q -m "packages: daily Debian trixie factory run"
          for i in 1 2 3 4 5; do
            git pull -q --rebase origin main && git push -q origin main && exit 0
            sleep 15
          done
          exit 1
